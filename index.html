<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Centro Médico y Obra Social</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <h1>Sistema de Gestión de Turnos</h1>
        <p>Selecciona el tipo de turno y el horario disponible (intervalos de 30 min)</p>
    </header>

    <main class="container">
        <!-- SECCIÓN OBRA SOCIAL -->
        <section class="panel panel-obra-social">
            <h2>Trámites Obra Social</h2>
            <form id="form-obra-social" class="turno-form">
                <div class="form-group">
                    <label for="nombre-os">Nombre y Apellido:</label>
                    <input type="text" id="nombre-os" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="tramite-os">Trámite:</label>
                    <select id="tramite-os" required>
                        <option value="">Selecciona un trámite</option>
                        <option value="Autorización">Autorización de estudios</option>
                        <option value="Afiliación">Alta / Modificación Afiliación</option>
                        <option value="Reintegros">Facturación y Reintegros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha-os">Fecha:</label>
                    <input type="date" id="fecha-os" class="fecha-input" required>
                </div>

                <div class="form-group">
                    <label for="hora-os">Hora disponible (cada 30 min):</label>
                    <select id="hora-os" required>
                        <option value="">Selecciona primero una fecha</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-os">Reservar Turno Obra Social</button>
            </form>

            <div class="turnos-reservados">
                <h3>Turnos Agendados (Obra Social)</h3>
                <ul id="lista-os" class="lista-turnos"></ul>
            </div>
        </section>

        <!-- SECCIÓN TURNOS MÉDICOS -->
        <section class="panel panel-medico">
            <h2>Turnos Médicos</h2>
            <form id="form-medico" class="turno-form">
                <div class="form-group">
                    <label for="nombre-med">Nombre del Paciente:</label>
                    <input type="text" id="nombre-med" required placeholder="Ej. María Gómez">
                </div>

                <div class="form-group">
                    <label for="especialidad-med">Especialidad:</label>
                    <select id="especialidad-med" required>
                        <option value="">Selecciona especialidad</option>
                        <option value="Clínica Médica">Clínica Médica</option>
                        <option value="Pediatría">Pediatría</option>
                        <option value="Traumatología">Traumatología</option>
                        <option value="Cardiología">Cardiología</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha-med">Fecha:</label>
                    <input type="date" id="fecha-med" class="fecha-input" required>
                </div>

                <div class="form-group">
                    <label for="hora-med">Hora disponible (cada 30 min):</label>
                    <select id="hora-med" required>
                        <option value="">Selecciona primero una fecha</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-med">Reservar Turno Médico</button>
            </form>

            <div class="turnos-reservados">
                <h3>Turnos Agendados (Médicos)</h3>
                <ul id="lista-med" class="lista-turnos"></ul>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
